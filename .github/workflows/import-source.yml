name: Import project source

on:
  push:
    paths:
      - release-control-source.zip
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract project source
        run: |
          unzip -o release-control-source.zip
          rm release-control-source.zip
          rm .github/workflows/import-source.yml
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete release control application"
          git push
