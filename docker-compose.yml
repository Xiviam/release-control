services:
  migrate:
    build: .
    env_file: .env
    entrypoint: []
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap-admin"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    entrypoint: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    entrypoint: []
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: release_control
      POSTGRES_USER: release_control
      POSTGRES_PASSWORD: release_control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_control -d release_control"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
